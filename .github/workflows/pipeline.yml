name: pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q 2>&1 | tee test_log.txt

      - name: Pipeline
        run: python run_all.py 2>&1 | tee run_log.txt

      - name: Save results
        run: |
          git config user.name  bymankirat
          git config user.email msinghsandal@gmail.com
          git add -A docs data/derived data/raw/manifest.json run_log.txt test_log.txt
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Pipeline run: results, figures and logs"
          git pull --rebase -X theirs
          git push
